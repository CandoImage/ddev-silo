#ddev-generated
services:
  silo:
    container_name: ddev-${DDEV_SITENAME}-silo
    image: ${SILO_DOCKER_IMAGE:-${MINIO_DOCKER_IMAGE:-pgsty/silo:latest}}
    hostname: ${DDEV_SITENAME}-silo
    environment:
      MINIO_VOLUMES: "/data"
      MC_CONFIG_DIR: "/root/.mc"
      MINIO_UID: $DDEV_UID
      MINIO_GID: $DDEV_GID
      MINIO_ROOT_USER: ddevminio
      MINIO_ROOT_PASSWORD: ddevminio
      MINIO_BROWSER_REDIRECT_URL: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:9090
      VIRTUAL_HOST: $DDEV_HOSTNAME
      HTTP_EXPOSE: "9089:9090,10100:10101"
      HTTPS_EXPOSE: "9090:9090,10101:10101"
    command: server --console-address :9090 --address :10101
    volumes:
      - "silo:/data"
      - ".:/mnt/ddev_config"
      - ddev-global-cache:/mnt/ddev-global-cache
      - type: volume
        source: ddev-global-cache
        target: /root/.minio/certs/CAs
        volume:
          subpath: mkcert
    configs:
      - source: mc-config.json
        target: /root/.mc/config.json
        mode: "0444"
    expose:
      - "9090"
      - "10101"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1024M"
        reservations:
          cpus: "1.5"
          memory: "512M"
    restart: "no"
    healthcheck:
      interval: 120s
      timeout: 2s
      retries: 1
    x-ddev:
      describe-info: |
        User: ddevminio
        Pass: ddevminio
        or ddevsilo/ddevsilo
      ssh-shell: bash

  # Compatibility service so "ddev exec -s minio", "ddev ssh -s minio", hooks with
  # "service: minio" and http://minio:10101 keep working. It runs no server of its own:
  # socat forwards the API and console ports to silo, so localhost:10101 and the mc
  # aliases behave like inside the silo container.
  minio:
    container_name: ddev-${DDEV_SITENAME}-minio
    # DDEV strips "-<project>-built" and pulls the base image (alpine:3) before building.
    image: alpine:3-${DDEV_SITENAME}-built
    build:
      args:
        SILO_IMAGE: ${SILO_DOCKER_IMAGE:-${MINIO_DOCKER_IMAGE:-pgsty/silo:latest}}
      dockerfile_inline: |
        ARG SILO_IMAGE
        FROM $${SILO_IMAGE} AS silo
        FROM alpine:3
        RUN apk add --no-cache bash curl socat
        COPY --from=silo /usr/bin/mc /usr/bin/mc
    init: true
    entrypoint:
      - bash
      - -c
      - "socat TCP-LISTEN:9090,fork,reuseaddr TCP:silo:9090 & exec socat TCP-LISTEN:10101,fork,reuseaddr TCP:silo:10101"
    depends_on:
      - silo
    environment:
      MC_CONFIG_DIR: "/root/.mc"
      MINIO_ROOT_USER: ddevminio
      MINIO_ROOT_PASSWORD: ddevminio
    volumes:
      - "silo:/data"
      - ".:/mnt/ddev_config"
      - ddev-global-cache:/mnt/ddev-global-cache
    configs:
      - source: mc-config.json
        target: /root/.mc/config.json
        mode: "0444"
    expose:
      - "9090"
      - "10101"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    deploy:
      resources:
        limits:
          memory: "64M"
    restart: "no"
    x-ddev:
      describe-info: |
        Alias of silo
      ssh-shell: bash

configs:
  mc-config.json:
    content: |
      {
        "version": "10",
        "aliases": {
          "silo": {
            "url": "http://localhost:10101",
            "accessKey": "ddevminio",
            "secretKey": "ddevminio",
            "api": "s3v4",
            "path": "auto"
          },
          "minio": {
            "url": "http://localhost:10101",
            "accessKey": "ddevminio",
            "secretKey": "ddevminio",
            "api": "s3v4",
            "path": "auto"
          }
        }
      }

volumes:
  # Keyed "silo" but reuses the existing MinIO Docker volume so data carries over.
  silo:
    name: ddev-${DDEV_SITENAME}-minio
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
